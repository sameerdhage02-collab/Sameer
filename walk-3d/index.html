<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#cfe3f2;overflow:hidden}</style>
</head><body>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const W = 1280, H = 720;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcfe3f2);
scene.fog = new THREE.Fog(0xcfe3f2, 12, 40);
const camera = new THREE.PerspectiveCamera(40, W / H, 0.1, 100);

scene.add(new THREE.HemisphereLight(0xffffff, 0x8a9a7a, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.position.set(5, 10, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6 });
scene.add(sun, sun.target);

// Ground with path tiles
const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200),
  new THREE.MeshStandardMaterial({ color: 0x9cc58a }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const tileMat = new THREE.MeshStandardMaterial({ color: 0xe8e1d3 });
for (let z = -10; z < 40; z++) {
  const t = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.04, 0.9), tileMat);
  t.position.set(0, 0.02, z); t.receiveShadow = true; scene.add(t);
}
// a few trees for depth / sense of motion
const trunkMat = new THREE.MeshStandardMaterial({ color: 0x7a5236 });
const leafMat = new THREE.MeshStandardMaterial({ color: 0x4f8f4a, flatShading: true });
for (let i = 0; i < 16; i++) {
  const side = i % 2 ? 1 : -1, z = -6 + i * 2.6;
  const g = new THREE.Group();
  const tr = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.14, 1.2), trunkMat); tr.position.y = 0.6;
  const lf = new THREE.Mesh(new THREE.IcosahedronGeometry(0.75, 0), leafMat); lf.position.y = 1.6;
  [tr, lf].forEach(m => { m.castShadow = true; g.add(m); });
  g.position.set(side < 0 ? -(3 + (i * 37 % 5) * 0.5) : 8 + (i * 37 % 5) * 0.6, 0, z);
  scene.add(g);
}

// ---- The man: simple jointed figure ----
const skin = new THREE.MeshStandardMaterial({ color: 0xe0ac85, roughness: 0.6 });
const shirt = new THREE.MeshStandardMaterial({ color: 0x2f6fb5, roughness: 0.7 });
const pants = new THREE.MeshStandardMaterial({ color: 0x2b2f3a, roughness: 0.8 });
const shoe = new THREE.MeshStandardMaterial({ color: 0x3a2418, roughness: 0.5 });
const hair = new THREE.MeshStandardMaterial({ color: 0x2a1b12, roughness: 0.9 });

function part(geo, mat, y) {
  const m = new THREE.Mesh(geo, mat); m.position.y = y; m.castShadow = true; return m;
}
const capsule = (r, l) => new THREE.CapsuleGeometry(r, l, 6, 14);

const man = new THREE.Group(); scene.add(man);
const hips = new THREE.Group(); hips.position.y = 0.95; man.add(hips);
hips.add(part(capsule(0.17, 0.12), pants, 0));
const torso = new THREE.Group(); hips.add(torso);
const chest = part(capsule(0.2, 0.38), shirt, 0.33); chest.scale.set(1.15, 1, 0.75); torso.add(chest);
torso.add(part(new THREE.CylinderGeometry(0.06, 0.07, 0.12), skin, 0.66));
const head = new THREE.Group(); head.position.y = 0.84; torso.add(head);
head.add(part(new THREE.SphereGeometry(0.15, 24, 18), skin, 0));
const hairCap = part(new THREE.SphereGeometry(0.155, 24, 12, 0, Math.PI * 2, 0, Math.PI * 0.5), hair, 0.02);
hairCap.rotation.x = -0.25; head.add(hairCap);
const nose = part(new THREE.ConeGeometry(0.025, 0.06, 8), skin, -0.01);
nose.rotation.x = Math.PI / 2; nose.position.z = 0.16; head.add(nose);
const eyeMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
[-0.05, 0.05].forEach(x => { const e = part(new THREE.SphereGeometry(0.018), eyeMat, 0.03); e.position.set(x, 0.03, 0.135); head.add(e); });

function makeLeg(side) {
  const hip = new THREE.Group(); hip.position.set(side * 0.1, -0.05, 0); hips.add(hip);
  hip.add(part(capsule(0.075, 0.3), pants, -0.22));
  const knee = new THREE.Group(); knee.position.y = -0.44; hip.add(knee);
  knee.add(part(capsule(0.065, 0.3), pants, -0.2));
  const ankle = new THREE.Group(); ankle.position.y = -0.42; knee.add(ankle);
  const foot = part(new THREE.BoxGeometry(0.11, 0.07, 0.26), shoe, -0.02); foot.position.z = 0.06; ankle.add(foot);
  return { hip, knee, ankle };
}
function makeArm(side) {
  const sh = new THREE.Group(); sh.position.set(side * 0.27, 0.56, 0); torso.add(sh);
  sh.add(part(capsule(0.06, 0.22), shirt, -0.15));
  const elbow = new THREE.Group(); elbow.position.y = -0.32; sh.add(elbow);
  elbow.add(part(capsule(0.05, 0.2), skin, -0.14));
  elbow.add(part(new THREE.SphereGeometry(0.055), skin, -0.3));
  return { sh, elbow };
}
const L = makeLeg(1), R = makeLeg(-1), LA = makeArm(1), RA = makeArm(-1);

// ---- Walk cycle ----
const STRIDE_T = 1.1;          // seconds per full cycle (two steps)
const SPEED = 1.25;            // metres per second
function pose(leg, p) {
  const s = Math.sin(p);
  leg.hip.rotation.x = -0.45 * s;                                  // swing thigh
  leg.knee.rotation.x = 0.9 * Math.max(0, Math.sin(p - Math.PI * 0.35)) ** 1.5 + 0.05; // bend during swing
  leg.ankle.rotation.x = -leg.hip.rotation.x - leg.knee.rotation.x * 0.6;  // keep foot fairly flat
}
function arm(a, p, side) {
  a.sh.rotation.x = 0.4 * Math.sin(p);
  a.sh.rotation.z = side * 0.06;
  a.elbow.rotation.x = -0.25 - 0.2 * Math.max(0, Math.sin(p));
}

window.renderAt = (t) => {
  const p = (t / STRIDE_T) * Math.PI * 2;
  pose(L, p); pose(R, p + Math.PI);
  arm(LA, p + Math.PI, 1); arm(RA, p, -1);
  hips.position.y = 0.95 + 0.035 * Math.cos(2 * p);   // bob twice per cycle
  hips.rotation.y = 0.08 * Math.sin(p);               // pelvis twist
  torso.rotation.y = -0.14 * Math.sin(p);             // counter-rotate shoulders
  torso.rotation.x = 0.04;
  hips.rotation.z = 0.03 * Math.sin(p);
  head.rotation.y = 0.1 * Math.sin(p);
  const z = t * SPEED;
  man.position.z = z;

  // camera: slow orbit from a 3/4 front view to a side view while tracking
  const a = THREE.MathUtils.lerp(0.45, 1.35, t / 5);
  camera.position.set(Math.sin(a) * 4, 1.5, z + Math.cos(a) * 4);
  camera.lookAt(0, 0.95, z);
  sun.position.set(5, 10, z + 6); sun.target.position.set(0, 0, z);
  renderer.render(scene, camera);
};
window.renderAt(0);
window.ready = true;
</script>
</body></html>

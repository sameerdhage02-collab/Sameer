const spr={};function gs(col){if(spr[col])return spr[col];const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');const r=g.createRadialGradient(64,64,0,64,64,64);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.18,col);r.addColorStop(.5,col.replace(/[\d.]+\)$/,'0.25)'));r.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=r;g.fillRect(0,0,128,128);return spr[col]=c;}

function render(t){X.setTransform(1,0,0,1,0,0);X.globalAlpha=1;

  for(const b of bok){const y=(b.y-t*22*b.s+H*10)%(H+200)-100,x=b.x+Math.sin(t*.4*b.s+b.p)*30;orb(x,y,b.r,b.c,.1+.06*Math.sin(t*1.3+b.p));}

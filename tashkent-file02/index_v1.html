<script type="module">
import * as THREE from 'three';
const W = 720, H = 1280;

// ---------------- utilities ----------------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ss = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;
function rng(seed) { return () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const M = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: .8, ...o });
const E = (color, i = 2) => new THREE.MeshStandardMaterial({ color: 0x000000, emissive: color, emissiveIntensity: i });
function mesh(geo, mat, x = 0, y = 0, z = 0, shadow = true) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = shadow; m.receiveShadow = true; return m;
}
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
}
function plane(tex, w, h, o = {}) {
  return new THREE.Mesh(new THREE.PlaneGeometry(w, h),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, ...o }));
}
const glowTex = canvasTex(128, 128, (c, w, h) => {
  const g = c.createRadialGradient(64, 64, 0, 64, 64, 64);
  g.addColorStop(0, 'rgba(255,255,255,1)'); g.addColorStop(.25, 'rgba(255,255,255,.55)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = g; c.fillRect(0, 0, w, h);
});
function glow(color, size) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
  s.scale.set(size, size, 1); return s;
}
function shake(t, t0, amp, dur = .6) {
  if (t < t0 || t > t0 + dur) return [0, 0];
  const k = (1 - (t - t0) / dur) ** 2 * amp;
  return [Math.sin(t * 91) * k, Math.cos(t * 77) * k];
}
function stampTex(lines, color = '#c4161c', w = 1024, h = 360) {
  return canvasTex(w, h, (c) => {
    c.save(); c.translate(w / 2, h / 2); c.rotate(-0.06);
    c.strokeStyle = color; c.lineWidth = 16; c.strokeRect(-w / 2 + 40, -h / 2 + 40, w - 80, h - 80);
    c.fillStyle = color; c.textAlign = 'center'; c.textBaseline = 'middle';
    const fs = lines.length > 1 ? 104 : 150;
    lines.forEach((l, i) => { c.font = `800 ${fs}px Mukta, Oswald`; c.fillText(l, 0, (i - (lines.length - 1) / 2) * fs * 1.05 + 8); });
    // rubber texture: knock out speckles
    c.globalCompositeOperation = 'destination-out'; const r = rng(lines[0].length * 7);
    for (let i = 0; i < 1600; i++) { c.globalAlpha = r() * .8; c.fillRect(-w / 2 + r() * w, -h / 2 + r() * h, 2 + r() * 5, 2 + r() * 4); }
    c.restore();
  });

// Stamp animation: slams in at time ts
function stampAnim(m, t, ts) {
  const k = clamp((t - ts) / .14);
  m.visible = t >= ts; m.material.opacity = k * .92;
  const s = lerp(2.6, 1, 1 - (1 - k) ** 3); m.scale.set(s, s, s);
}

// ---------------- people ----------------
function makePerson(mat, { woman = false, h = 1 } = {}) {
  const cap = (r, l) => new THREE.CapsuleGeometry(r, l, 5, 12);
  const g = new THREE.Group(); const hips = new THREE.Group(); hips.position.y = .95; g.add(hips);
  hips.add(mesh(cap(.17, .12), mat));
  const torso = new THREE.Group(); hips.add(torso);
  const chest = mesh(cap(.2, .38), mat, 0, .33); chest.scale.set(1.12, 1, .72); torso.add(chest);
  torso.add(mesh(new THREE.CylinderGeometry(.06, .07, .12), mat, 0, .66));
  const head = mesh(new THREE.SphereGeometry(.15, 20, 16), mat, 0, .84); torso.add(head);
  const legs = [], arms = [];
  for (const s of [1, -1]) {
    const hip = new THREE.Group(); hip.position.set(s * .1, -.05, 0); hips.add(hip);
    hip.add(mesh(cap(.075, .3), mat, 0, -.22));
    const knee = new THREE.Group(); knee.position.y = -.44; hip.add(knee);
    knee.add(mesh(cap(.065, .3), mat, 0, -.2));
    knee.add(mesh(new THREE.BoxGeometry(.11, .07, .26), mat, 0, -.44, .06));
    legs.push({ hip, knee });
    const sh = new THREE.Group(); sh.position.set(s * .27, .56, 0); torso.add(sh);
    sh.add(mesh(cap(.06, .22), mat, 0, -.15));
    const el = new THREE.Group(); el.position.y = -.32; sh.add(el);
    el.add(mesh(cap(.05, .2), mat, 0, -.14)); arms.push({ sh, el });
  }
  if (woman) { // saree drape silhouette
    const skirt = mesh(new THREE.CylinderGeometry(.16, .34, .95, 16, 1, true), mat, 0, -.5); hips.add(skirt);
    const pallu = mesh(new THREE.BoxGeometry(.5, .5, .05), mat, 0, .45, -.13); pallu.rotation.z = .5; torso.add(pallu);
    const bun = mesh(new THREE.SphereGeometry(.08, 12, 10), mat, 0, .86, -.13); torso.add(bun);
  }
  g.scale.setScalar(h);
  const walk = (t, period = 1.1) => {
    const p = t / period * Math.PI * 2;
    legs.forEach((l, i) => { const q = p + i * Math.PI; l.hip.rotation.x = -.45 * Math.sin(q); l.knee.rotation.x = .9 * Math.max(0, Math.sin(q - 1.1)) ** 1.5 + .05; });
    arms.forEach((a, i) => { const q = p + (1 - i) * Math.PI; a.sh.rotation.x = .4 * Math.sin(q); a.el.rotation.x = -.3; });
    hips.position.y = .95 + .035 * Math.cos(2 * p); torso.rotation.y = -.12 * Math.sin(p);
  };
  const stand = (bow = 0) => {
    legs.forEach(l => { l.hip.rotation.x = 0; l.knee.rotation.x = .02; });
    arms.forEach((a, i) => { a.sh.rotation.x = .05; a.sh.rotation.z = (i ? -1 : 1) * .06; a.el.rotation.x = -.15; });
    torso.rotation.x = bow; head.rotation.x = bow;
  };
  stand();
  return { g, walk, stand, head, torso, arms };
}

// ---------------- vehicles ----------------
function makeCar(color) {
  const g = new THREE.Group();
  const paint = M(color, { roughness: .35, metalness: .4 });
  g.add(mesh(new THREE.BoxGeometry(1.8, .6, 4.3), paint, 0, .62));
  const cab = mesh(new THREE.BoxGeometry(1.62, .55, 2.1), paint, 0, 1.18, .15); g.add(cab);
  g.add(mesh(new THREE.BoxGeometry(1.64, .42, 2.0), M(0x0c1118, { roughness: .1, metalness: .8 }), 0, 1.2, .15, false));
  const wheelG = new THREE.CylinderGeometry(.36, .36, .26, 16); wheelG.rotateZ(Math.PI / 2);
  for (const x of [-.86, .86]) for (const z of [-1.35, 1.35]) g.add(mesh(wheelG, M(0x0a0a0a), x, .36, z));
  const lights = [];
  for (const x of [-.6, .6]) {
    g.add(mesh(new THREE.SphereGeometry(.13, 12, 8), E(0xfff2c8, 6), x, .68, -2.14, false));
    g.add(mesh(new THREE.BoxGeometry(.3, .12, .05), E(0xff1010, 3), x, .72, 2.16, false));
    const gl = glow(0xfff0c0, 2.2); gl.position.set(x, .68, -2.3); g.add(gl); lights.push(gl);
  }
  const spot = new THREE.SpotLight(0xfff0c8, 60, 45, .5, .5, 1.2); spot.position.set(0, .8, -2.2);
  spot.target.position.set(0, 0, -14); g.add(spot, spot.target);
  return { g, glows: lights, spot };
}
function makeTruck() {
  const g = new THREE.Group();
  g.add(mesh(new THREE.BoxGeometry(2.5, 2.3, 2.4), M(0x9b6a1c, { roughness: .5 }), 0, 1.7, -4.6));
  g.add(mesh(new THREE.BoxGeometry(2.4, .9, 1.9), M(0x0c1118, { roughness: .1, metalness: .8 }), 0, 2.15, -5.81, false));
  g.add(mesh(new THREE.BoxGeometry(2.6, 2.6, 7), M(0x4a3b2a), 0, 2.0, 0.5));
  const wheelG = new THREE.CylinderGeometry(.5, .5, .4, 16); wheelG.rotateZ(Math.PI / 2);
  for (const x of [-1.15, 1.15]) for (const z of [-4.6, -.5, 2.6]) g.add(mesh(wheelG, M(0x0a0a0a), x, .5, z));
  const glows = [];
  for (const x of [-.85, .85]) {
    g.add(mesh(new THREE.SphereGeometry(.2, 12, 8), E(0xffffff, 9), x, 1.0, -5.82, false));
    const gl = glow(0xfff6e0, 4); gl.position.set(x, 1.0, -6.1); g.add(gl); glows.push(gl);
  }
  const spot = new THREE.SpotLight(0xfff6e0, 140, 70, .55, .5, 1.1); spot.position.set(0, 1.2, -6);
  spot.target.position.set(0, 0, -20); g.add(spot, spot.target);
  return { g, glows, spot };
}
function road(scene, len = 600, lanes = true) {
  scene.add(mesh(new THREE.PlaneGeometry(400, len).rotateX(-Math.PI / 2), M(0x0b0d10), 0, -.01, -len / 2 + 60, false));
  scene.add(mesh(new THREE.PlaneGeometry(9, len).rotateX(-Math.PI / 2), M(0x1a1c20, { roughness: .6 }), 0, 0, -len / 2 + 60, false));
  const dash = new THREE.InstancedMesh(new THREE.PlaneGeometry(.18, 3).rotateX(-Math.PI / 2), M(0xd9d2b8, { emissive: 0x332f22 }), Math.floor(len / 8));
  const m4 = new THREE.Matrix4();
  for (let i = 0; i < dash.count; i++) { m4.makeTranslation(0, .01, 60 - i * 8); dash.setMatrixAt(i, m4); }
  dash.receiveShadow = true; scene.add(dash);
  // roadside reflector posts
  const post = new THREE.InstancedMesh(new THREE.BoxGeometry(.12, .9, .12), M(0xdddddd, { emissive: 0x221100 }), Math.floor(len / 12) * 2);
  let k = 0; for (let i = 0; i < len / 12; i++) for (const x of [-5.4, 5.4]) { m4.makeTranslation(x, .45, 60 - i * 12); post.setMatrixAt(k++, m4); }
  scene.add(post);
}
function snowField(n, area, seed) {
  const r = rng(seed); const base = new Float32Array(n * 4);
  for (let i = 0; i < n; i++) { base[i * 4] = (r() - .5) * area[0]; base[i * 4 + 1] = r() * area[1]; base[i * 4 + 2] = (r() - .5) * area[2]; base[i * 4 + 3] = .4 + r() * .6; }
  const geo = new THREE.BufferGeometry(); const pos = new Float32Array(n * 3);
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({ color: 0xffffff, size: .09, map: glowTex, transparent: true, depthWrite: false, opacity: .9 }));
  pts.update = (t, fall = .9) => {
    for (let i = 0; i < n; i++) {
      const v = base[i * 4 + 3];
      pos[i * 3] = base[i * 4] + Math.sin(t * .7 + i) * .3;
      pos[i * 3 + 1] = ((base[i * 4 + 1] - t * fall * v) % area[1] + area[1]) % area[1];
      pos[i * 3 + 2] = base[i * 4 + 2];
    }
    geo.attributes.position.needsUpdate = true;
  };
  return pts;
}
function haze(n, box, seed, color = 0xffffff, size = .05) {
  const r = rng(seed); const pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { pos[i * 3] = (r() - .5) * box[0]; pos[i * 3 + 1] = r() * box[1]; pos[i * 3 + 2] = (r() - .5) * box[2]; }
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  return new THREE.Points(geo, new THREE.PointsMaterial({ color, size, map: glowTex, transparent: true, opacity: .5, depthWrite: false, blending: THREE.AdditiveBlending }));
}
function cone(color, r, h, op = .07) { // visible light cone
  const m = new THREE.Mesh(new THREE.ConeGeometry(r, h, 32, 1, true),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: op, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
  return m;
}

// ---------------- evidence cards ----------------
function cardTex(num, name, role, { faded = 0, center = false } = {}) {
  return canvasTex(600, 760, (c, w, h) => {
    c.fillStyle = center ? '#e9e1cc' : '#efe7d2'; c.fillRect(0, 0, w, h);
    c.fillStyle = '#1b1b1b'; c.fillRect(40, 40, w - 80, 440);
    // silhouette
    c.fillStyle = `rgb(${90 + faded * 80},${90 + faded * 80},${90 + faded * 80})`;
    c.beginPath(); c.arc(w / 2, 200, 82, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.ellipse(w / 2, 470, 170, 170, 0, Math.PI, 0); c.fill();
    c.fillStyle = '#efe7d2'; c.font = '800 120px Oswald'; c.textAlign = 'center';
    c.fillStyle = `rgba(255,255,255,${0.9 - faded * .6})`; c.fillText('?', w / 2, 240);
    c.globalAlpha = 1 - faded * .85;
    c.fillStyle = '#1a1a1a'; c.font = '700 64px Oswald'; c.fillText(name, w / 2, 575);
    c.fillStyle = '#7a1212'; c.font = '700 36px Oswald'; c.fillText(role, w / 2, 630);
    c.globalAlpha = 1;
    if (num) { c.fillStyle = '#c4161c'; c.fillRect(w - 150, 0, 150, 90); c.fillStyle = '#fff'; c.font = '700 54px Oswald'; c.fillText(num, w - 75, 66); }
    const r = rng(name.length * 13); c.globalAlpha = .12;
    for (let i = 0; i < 900; i++) { c.fillStyle = r() > .5 ? '#5a4a2a' : '#fff'; c.fillRect(r() * w, r() * h, 2, 2); }
  });
}
function buildBoard(scene) {
  const cork = canvasTex(1024, 1024, (c, w, h) => {
    c.fillStyle = '#6b4a2b'; c.fillRect(0, 0, w, h); const r = rng(5);
    for (let i = 0; i < 26000; i++) { const v = 70 + r() * 70; c.fillStyle = `rgb(${v + 30},${v},${v * .6})`; c.fillRect(r() * w, r() * h, 2 + r() * 3, 2 + r() * 3); }
  });
  cork.wrapS = cork.wrapT = THREE.RepeatWrapping;
  const board = mesh(new THREE.BoxGeometry(8, 10, .3), new THREE.MeshStandardMaterial({ map: cork, roughness: .95 }), 0, 0, -.2);
  scene.add(board);
  const frame = M(0x2a1a0e); for (const [x, y, w, h] of [[0, 5.1, 8.4, .3], [0, -5.1, 8.4, .3], [4.1, 0, .3, 10.4], [-4.1, 0, .3, 10.4]]) scene.add(mesh(new THREE.BoxGeometry(w, h, .5), frame, x, y, -.1));
  const mk = (tex, x, y, rot) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 3.04), new THREE.MeshStandardMaterial({ map: tex, roughness: .9 })); m.position.set(x, y, .0); m.rotation.z = rot; m.castShadow = true; scene.add(m); return m; };
  const center = mk(cardTex('', 'L.B. SHASTRI', 'TASHKENT · JAN 1966', { center: true }), 0, 2.7, .02);
  const c1 = mk(cardTex('#1', 'DR. R.N. CHUGH', 'PERSONAL DOCTOR'), -1.9, -2.2, -.06);
  const c2 = mk(cardTex('#2', 'RAM NATH', 'PERSONAL ATTENDANT'), 1.9, -2.0, .05);
  const pinM = M(0xd01818, { roughness: .3 });
  const pins = [[0, 4.1], [-1.9, -.8], [1.9, -.6]].map(([x, y]) => { const p = mesh(new THREE.SphereGeometry(.12, 12, 10), pinM, x, y, .12); scene.add(p); return p; });
  const strM = M(0xb01010, { roughness: .6, emissive: 0x200000 });
  for (const i of [1, 2]) {
    const a = pins[0].position, b = pins[i].position; const d = a.distanceTo(b);
    const s = mesh(new THREE.CylinderGeometry(.025, .025, d, 6), strM); s.position.copy(a).add(b).multiplyScalar(.5); s.position.z = .1;
    s.rotation.z = Math.atan2(b.y - a.y, b.x - a.x) - Math.PI / 2; scene.add(s);
  }
  return { c1, c2, center };
}

function chunk(text) {

    let html = '';

  }

    if (i === toks.length - 1 || (len > 22 && tk.end) || len > 34) { chunks.push(cur); cur = []; len = 0; }

    let pre = '', open = '';

    return { toks: c, len: c.reduce((a, b) => a + b.len, 0) };

  const ch = M(0x1d120a); const chair = new THREE.Group(); chair.add(mesh(new THREE.BoxGeometry(.7, .08, .7), ch, 0, .6, 0), mesh(new THREE.BoxGeometry(.7, 1.1, .08), ch, 0, 1.15, .33));
  for (const a of [-.3, .3]) for (const b of [-.3, .3]) chair.add(mesh(new THREE.BoxGeometry(.06, .6, .06), ch, a, .3, b)); chair.position.set(0, 0, 1.4); scene.add(chair);
  const lampG = new THREE.Group(); lampG.position.set(0, 3.2, .2); scene.add(lampG);
  lampG.add(mesh(new THREE.ConeGeometry(.4, .35, 24, 1, true), M(0x1a2a1a, { side: THREE.DoubleSide }), 0, 0, 0, false));
  lampG.add(mesh(new THREE.CylinderGeometry(.01, .01, 3), M(0x111111), 0, 1.6, 0, false));
  const bulb = glow(0xffd090, .8); bulb.position.y = -.1; lampG.add(bulb);
  const lamp = new THREE.SpotLight(0xffd090, 30, 8, .6, .5, 1.4); lamp.position.set(0, 3.05, .2); lamp.target.position.set(0, 1, .2); lamp.castShadow = true; lamp.shadow.mapSize.set(1024, 1024); scene.add(lamp, lamp.target);
  scene.add(new THREE.AmbientLight(0x110a06, .5));
  const c = cam(45);
  const s2 = S.segs[1].start;
  return {

      const fl = t > s2 ? (Math.sin(t * 40) > .2 && Math.sin(t * 9) > -.6 ? 1 : .25) : 1;
      lamp.intensity = 30 * fl; bulb.material.opacity = fl; lampG.rotation.z = Math.sin(t * .9) * .04;
      return { loc: t < 3 ? 'TASHKENT · THAT NIGHT' : '' };
    }
  };
};

B.end = (S) => {
  const scene = new THREE.Scene(); scene.background = new THREE.Color(0x000000);
  const c = cam(); EVENTS.push({ t: .05, type: 'stamp' });
  return { scene, camera: c, update(t) { return { big: `<div class="redbox">NEXT</div><div class="file">FILE 03<small>खाना किसने बनाया?</small></div>`, bigOp: ss(0, .3, t), hideCap: true }; } };
};

// ---------------- build all ----------------
await document.fonts.load('800 50px Mukta', 'अ'); await document.fonts.load('800 50px Mukta', 'A'); await document.fonts.load('700 50px Oswald'); await document.fonts.load('700 50px Mukta', 'अ');
await document.fonts.ready;
const built = spans.map(sp => { const evStart = EVENTS.length; const b = B[sp.name](sp); for (let i = evStart; i < EVENTS.length; i++) EVENTS[i].t += sp.start; return { ...sp, ...b }; });
// scene boundary whooshes
built.forEach((b, i) => i && EVENTS.push({ t: b.start, type: 'cut' }));

const $ = id => document.getElementById(id);
const grain = $('grain').getContext('2d'); const gimg = grain.createImageData(180, 320);
window.TOTAL = TOTAL; window.EVENTS = EVENTS; window.SEGTIMES = segs.map(s => ({ start: s.start, dur: s.dur, text: s.text }));
window.renderAt = (T) => {
  let bi = built.findIndex(b => T >= b.start && T < b.start + b.dur); if (bi < 0) bi = built.length - 1;
  const b = built[bi]; const t = T - b.start;
  renderer.toneMappingExposure = 1.1;
  const ui = b.update(t) || {};
  const camera = ui.camera || b.camera;
  renderer.render(b.scene, camera);

  let html = '';
  if (!ui.hideCap) for (const sg of b.segs) for (const ch of sg.chunks) if (t >= ch.start && t < ch.end) html = ch.html;
  $('cap').innerHTML = html;
  $('loc').textContent = ui.loc || '';
  $('big').innerHTML = ui.big || ''; $('big').style.opacity = ui.bigOp ?? 1;
  $('flash').style.opacity = ui.flash || 0;

  const fin = 1 - ss(0, .3, t), fout = ss(b.dur - .3, b.dur, t);
  $('fade').style.opacity = Math.max(bi ? fin : 1 - ss(0, .6, t), bi < built.length - 1 ? fout : ss(b.dur - .8, b.dur, t));
  $('tag').style.opacity = b.name === 'end' ? 0 : .85;

  const r = rng(Math.floor(T * 30) + 1); const d = gimg.data;
  for (let i = 0; i < d.length; i += 4) { const v = r() * 255; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 255; }

};
window.renderAt(0);
window.ready = true;

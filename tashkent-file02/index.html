.redbox{background:#c4161c;color:#fff;font:700 40px Oswald;letter-spacing:6px;padding:8px 22px 4px;margin-bottom:22px}
.quote{font:800 56px/1.35 Mukta;color:#fff3d6;padding:0 60px;text-shadow:0 4px 30px #000,0 0 3px #000;margin-top:-640px}

const ALIGN = await (await fetch('audio/align.json')).json();
const TAIL = 2.4;
const TOTAL = ALIGN.duration + TAIL;
const plainLen = s => s.replace(/[*_]/g, '').length;
const segs = SEGS.map((text, i) => ({ text, start: ALIGN.starts[i], end: i === SEGS.length - 1 ? TOTAL : ALIGN.ends[i] }));
const SIL = ALIGN.silences.map(([a, b]) => (a + b) / 2);
function chunk(text) {
  let mode = ''; const toks = [];
  for (const w of text.split(' ')) { let html = ''; for (const ch of w) { if (ch === '*' || ch === '_') { if (mode === ch) { html += '</em>'; mode = ''; } else { html += ch === '*' ? '<em>' : '<em class="r">'; mode = ch; } } else html += ch; } toks.push({ html, open: mode, len: plainLen(w) + 1, end: /[…,।:?.”]$/.test(w.replace(/[*_]/g, '')) }); }
  const chunks = []; let cur = [], len = 0;
  toks.forEach((tk, i) => { cur.push(tk); len += tk.len; if (i === toks.length - 1 || (len > 20 && tk.end) || len > 32) { chunks.push(cur); cur = []; len = 0; } });
  return chunks.map(c => ({ toks: c, len: c.reduce((a, b) => a + b.len, 0) }));
}
segs.forEach((s, si) => {
  const ch = chunk(s.text), total = ch.reduce((a, b) => a + b.len, 0);
  const speakEnd = si === segs.length - 1 ? ALIGN.duration : s.end;
  let acc = 0, carry = '', prevEnd = s.start;
  s.chunks = ch.map((c, k) => {
    let html = carry ? (carry === '*' ? '<em>' : '<em class="r">') : '';
    html += c.toks.map(t => t.html).join(' '); const last = c.toks[c.toks.length - 1].open; if (last) html += '</em>'; carry = last;
    acc += c.len; let end = s.start + (speakEnd - s.start) * acc / total;
    if (k < ch.length - 1) { const near = SIL.filter(m => m > s.start + .4 && m < speakEnd - .3).sort((a, b) => Math.abs(a - end) - Math.abs(b - end))[0]; if (near !== undefined && Math.abs(near - end) < .8) end = near; }
    else end = s.end;
    const o = { html, start: prevEnd, end }; prevEnd = end; return o;
  });
});
